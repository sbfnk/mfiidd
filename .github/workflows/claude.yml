# The on-demand review lane, adapted from epiforecasts/ForecastEnsembles.jl.
#
# `claude-code-review.yml` reviews pull requests automatically, and only for the
# authors listed there. This one is the manual counterpart: comment `@claude` on
# any pull request or issue and it runs, whoever opened it.
#
# The two are gated differently on purpose. The automatic lane asks who *wrote*
# the pull request, because it spends a token without anyone choosing to. This
# one asks who *triggered* it, because that person is choosing to spend it.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # The people whose tokens this repository can spend. The action already
    # refuses anyone without write access, so this narrows it further: write
    # access means you may merge, not that someone else should pay for your
    # reviews.
    #
    # Adding a login here means "this person may spend the token in
    # CLAUDE_CODE_OAUTH_TOKEN". If a collaborator wants reviews on their own
    # account instead, see CONTRIBUTING.md — that runs outside this repository,
    # because a workflow here can only ever use this repository's secrets.
    if: |
      contains(fromJSON('["sbfnk"]'), github.actor) && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Specify model (defaults to Claude Sonnet 4, uncomment for Claude Opus 4)
          # model: "claude-opus-4-20250514"

          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"

          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"

          # Optional: Allow Claude to run specific commands
          # allowed_tools: "Bash(npm install),Bash(npm run build),Bash(npm run test:*),Bash(npm run lint:*)"

          # Optional: Add custom instructions for Claude to customize its behavior for your project
          # custom_instructions: |
          #   Follow our coding standards
          #   Ensure all new code has tests
          #   Use TypeScript for new files

          # Optional: Custom environment variables for Claude
          # claude_env: |
          #   NODE_ENV: test
