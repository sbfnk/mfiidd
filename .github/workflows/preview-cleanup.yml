name: preview cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove PR preview folder
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d "previews/PR-${PR_NUMBER}" ]; then
            rm -rf "previews/PR-${PR_NUMBER}"
            git add -A
            git commit -m "clean preview for PR-${PR_NUMBER}"
            git push
          else
            echo "No preview to clean up for PR-${PR_NUMBER}"
          fi

      # The deploy job's comment points at the folder just deleted, so take it
      # down with it. The marker is the one in build-and-deploy.yml.
      - name: Remove the preview comment
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- preview-link -->';
            const {owner, repo} = context.repo;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {owner, repo, issue_number: context.issue.number},
            );
            for (const c of comments.filter((c) => c.body.includes(marker))) {
              await github.rest.issues.deleteComment(
                {owner, repo, comment_id: c.id},
              );
            }
