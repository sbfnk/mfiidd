name: preview cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: preview-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove PR preview folder
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d "previews/PR-${PR_NUMBER}" ]; then
            rm -rf "previews/PR-${PR_NUMBER}"
            git add -A
            git commit -m "clean preview for PR-${PR_NUMBER}"
            git push
          else
            echo "No preview to clean up for PR-${PR_NUMBER}"
          fi
