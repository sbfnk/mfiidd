name: Update Julia dependencies

on:
  schedule:
    - cron: '0 6 1 * *'  # 1st of every month at 06:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.5'

      - name: Update packages
        run: julia --project=. -e 'using Pkg; Pkg.update()'

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Update Julia package dependencies"
          title: "Update Julia package dependencies"
          body: |
            Automated monthly update of `Manifest.toml` via `Pkg.update()`.

            If the deploy check passes, these updates are safe to merge.
          branch: automated/update-julia-deps
          delete-branch: true
